name: Dependency advisory audit

on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Audit (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        scope: [full, production]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          run_install: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
      # Audit the committed lockfile without installing packages or scripts.
      # Keep pnpm's non-zero status for advisories AND registry failures.
      - name: Audit lockfile
        env:
          AUDIT_SCOPE: ${{ matrix.scope }}
        run: |
          if [ "$AUDIT_SCOPE" = production ]; then
            pnpm audit --prod --json > dependency-audit.json
          else
            pnpm audit --json > dependency-audit.json
          fi
      - name: Retain advisory or registry-error report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-audit-${{ matrix.scope }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: dependency-audit.json
          if-no-files-found: error
          retention-days: 14
